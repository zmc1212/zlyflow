  script: inject_craft
  assets: inject_craft
  episodes: inject_craft
  storyboard: inject_craft
workshop_shot:
  - write_timestamped_zh_prompt
  - polish_ref2va
  - bind_r2v_slots
r2v_slots:
  - source: characters
    role: subject
  - source: scene
packing_overrides:
  allow_timeranges: true
  allow_multi_camera_path: true
  faithful_zh_pack: true
  skip_program_pack: true
confirm_format:
  aspect_ratio: "16:9"
  duration_min: 5
  duration_max: 15
