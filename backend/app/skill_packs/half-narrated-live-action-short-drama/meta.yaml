# Hub official v1.0.1 — see SOURCE.md
id: half-narrated-live-action-short-drama
name: 半解说真人短剧
summary: 将故事或剧本制作成由旁白推进、角色对白补充的真人短剧单集，并确认视频分辨率。
author: MiniMax Design
cover: "https://cdn.hailuoai.com/hailuo-video-web/public_assets/b5efbc58-d361-49b1-9381-2b20863831a4.mp4"
version: "1.0.1"
surfaces: [director2, workshop, optimize]
visual_lock: photoreal-live-action-short-drama
director2_overlay:
  script: inject_craft
  assets: inject_craft
  episodes: inject_craft
  storyboard: inject_craft
workshop_shot:
  - generate_shot_triptych
  - extract_triptych_panels
  - write_timestamped_zh_prompt
  - polish_ref2va
  - bind_r2v_slots
r2v_slots:
  - source: characters
  - source: scene
  - source: triptych.start
  - source: triptych.mid
  - source: triptych.end
packing_overrides:
  allow_timeranges: true
  allow_multi_camera_path: true
  faithful_zh_pack: true
  skip_program_pack: true  # temporary: ship GPT English six-section; set false to restore local packing
confirm_format:
  aspect_ratio: "9:16"
  duration_min: 5
  duration_max: 15
  resolution: user-confirmed
