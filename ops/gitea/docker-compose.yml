# ZLY 自建 CI:Gitea(代码托管 + Actions CI + 容器镜像仓库)+ act_runner
# 首次安装步骤见 docs/CI-CD-Gitea部署指南.md,概要:
#   1. 把 ops/gitea 整个目录拷到服务器(如 /opt/zly-ci)
#   2. cp .env.example .env 并修改域名/端口/管理员密码
#   3. bash setup.sh(自动建管理员、注册 runner、做安全检查)
name: zly-ci

services:
  gitea:
    image: gitea/gitea:1.24
    container_name: zly-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: ${TZ:-Asia/Shanghai}
      # 环境变量方式初始化配置(app.ini),避免手工改文件
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-127.0.0.1}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://127.0.0.1:3080/}
      GITEA__server__HTTP_PORT: "3000"
      # 内网/可信环境用 HTTP 推拉代码即可;需要 SSH 协议时再改 false 并加端口映射
      GITEA__server__DISABLE_SSH: "true"
      GITEA__security__INSTALL_LOCK: "true"
      # 由管理员统一建账号(含 ci-bot);需要开放注册时改为 false
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 允许从局域网/任意地址迁移仓库(如 GitBlit)
      GITEA__migrations__ALLOW_LOCALNETWORKS: "true"
      # 容器镜像仓库(Registry)挂在 Gitea 的 packages 能力上
      GITEA__packages__ENABLED: "true"
    ports:
      - "${GITEA_PORT:-3080}:3000"
    volumes:
      - zly-gitea-data:/data

  act-runner:
    image: gitea/act_runner:0.2
    container_name: zly-act-runner
    restart: unless-stopped
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      # 首次启动自动注册;token 由 setup.sh 生成并写入 .env
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-zly-runner-1}
      TZ: ${TZ:-Asia/Shanghai}
    # runner 需要操作宿主机 Docker 来创建 job 容器、执行 docker build/push
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-config.yaml:/config.yaml:ro
      - zly-runner-data:/data
    command: ["act_runner", "daemon", "--config", "/config.yaml"]

volumes:
  zly-gitea-data:
  zly-runner-data:
