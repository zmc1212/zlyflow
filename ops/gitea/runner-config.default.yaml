# act_runner 配置模板(setup.sh 会复制为 runner-config.yaml,后者可按需修改,不进 Git)
log:
  level: info

runner:
  file: /data/.runner
  # 同时执行的任务数;docker build 吃内存,1C2G 机器建议保持 1
  capacity: 1
  # 单个 job 的超时时间(本项目构建+部署一般在 10 分钟内)
  timeout: 120m
  # Gitea 如果启用自签 HTTPS,需要改为 true
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  # 标签名与工作流里的 runs-on 对应;镜像内含 docker CLI,job 里可直接用宿主机 Docker
  labels:
    - "ubuntu-latest:docker://docker:27-cli"

cache:
  # 本工作流不使用 actions/cache,关闭以省资源
  enabled: false

container:
  privileged_mode: false
  options: ""
  workdir_parent: /data/workspace
  # 白名单:允许工作流在 job 容器里挂载的宿主机路径(docker build 必需)
  valid_volumes:
    - /var/run/docker.sock

host:
  workdir_parent: /data/host-workdir
